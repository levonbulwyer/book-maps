<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Reading Ledger &mdash; Levon's Book Projects</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  :root{
    --bg:#EAE7DC;
    --surface:#FBFAF6;
    --surface-2:#F1EEE4;
    --ink:#25281F;
    --ink-soft:#5B5E4F;
    --line:#D6D2C2;
    --accent:#2F4858;
    --accent-ink:#F3F1E6;
    --gold:#A9772F;
    --gold-soft:#E8D9BC;
    --moss:#5B7553;
    --danger:#9A4B3F;
    --shadow:0 1px 2px rgba(37,40,31,.06), 0 6px 16px -8px rgba(37,40,31,.18);
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#191B16;
      --surface:#22241D;
      --surface-2:#2A2C23;
      --ink:#EDE9DA;
      --ink-soft:#B3AF9C;
      --line:#3A3C31;
      --accent:#7FA3B8;
      --accent-ink:#171B1E;
      --gold:#D7A552;
      --gold-soft:#453B26;
      --moss:#8AAE7E;
      --danger:#D98C7C;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 24px -10px rgba(0,0,0,.55);
      color-scheme:dark;
    }
  }

  *,*::before,*::after{box-sizing:border-box}
  [hidden]{display:none!important}
  img{max-width:100%}

  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:"Work Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    padding-inline:20px;
    padding-block:28px 40px;
    -webkit-font-smoothing:antialiased;
  }

  .display{ font-family:"Fraunces", Georgia, serif; }
  .num{ font-family:"IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace; font-variant-numeric:tabular-nums; }

  #app{ max-width:920px; margin:0 auto; }

  .back-link{ display:inline-flex; align-items:center; gap:5px; font-size:13px; font-weight:600; color:var(--ink-soft); text-decoration:none; margin-bottom:16px; }
  .back-link:hover{ color:var(--accent); }

  header.top{
    display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:space-between;
    gap:20px; margin-bottom:26px;
  }
  header.top h1{
    font-size:clamp(28px,4vw,38px); font-weight:600; margin:0 0 4px; letter-spacing:-.01em;
  }
  header.top p.tag{ margin:0; color:var(--ink-soft); font-size:14px; }

  .summary-card{
    background:var(--surface); border:1px solid var(--line); border-radius:14px;
    padding:14px 18px; box-shadow:var(--shadow); min-width:230px;
  }
  .summary-card .row{ display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:8px; }
  .summary-card .row:last-of-type{ margin-bottom:10px; }
  .summary-card .label{ font-size:12px; text-transform:uppercase; letter-spacing:.07em; color:var(--ink-soft); }
  .summary-card .value{ font-size:18px; font-weight:600; }
  .bar{ height:7px; border-radius:99px; background:var(--surface-2); overflow:hidden; border:1px solid var(--line); }
  .bar > span{ display:block; height:100%; background:linear-gradient(90deg,var(--gold),var(--accent)); border-radius:99px; transition:width .35s ease; }

  .tabs{ display:flex; gap:6px; margin:18px 0 20px; flex-wrap:wrap; }
  .tab{
    font:inherit; font-size:13px; font-weight:600; color:var(--ink-soft);
    background:transparent; border:1px solid var(--line); border-radius:99px;
    padding:6px 14px; cursor:pointer;
  }
  .tab[aria-pressed="true"]{ background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }

  .shelf{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(270px,1fr)); gap:16px;
  }

  .book{
    background:var(--surface); border:1px solid var(--line); border-radius:14px;
    box-shadow:var(--shadow); overflow:hidden; display:flex;
  }
  .book .spine{ width:8px; flex-shrink:0; }
  .book .body{ padding:16px 18px; flex:1; min-width:0; }

  .book h3{ font-size:20px; font-weight:600; margin:0 0 2px; line-height:1.2; }
  .book .author{ font-style:italic; color:var(--ink-soft); font-size:13.5px; margin:0 0 12px; }

  .progress-row{ display:flex; align-items:center; gap:10px; margin-bottom:4px; }
  .progress-row .bar{ flex:1; }
  .progress-row .pct{ font-size:13px; font-weight:600; width:38px; text-align:right; flex-shrink:0; }
  .book .count{ font-size:12.5px; color:var(--ink-soft); margin:0 0 12px; }

  .status-pill{ display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:600; padding:3px 9px; border-radius:99px; margin-bottom:12px; }
  .status-pill.finished{ background:var(--gold-soft); color:var(--gold); }
  .status-pill.reading{ background:var(--surface-2); color:var(--accent); }
  .status-pill.notstarted{ background:var(--surface-2); color:var(--ink-soft); }
  .status-pill.empty{ background:var(--surface-2); color:var(--ink-soft); }

  .book-actions{ display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:6px; }
  .link-btn{
    font:inherit; font-size:13px; font-weight:600; color:var(--accent); background:none; border:none;
    cursor:pointer; padding:4px 2px; display:inline-flex; align-items:center; gap:5px;
  }
  .link-btn.danger{ color:var(--danger); }

  .chevron{ display:inline-block; transition:transform .18s ease; }
  .book[data-expanded="true"] .chevron{ transform:rotate(90deg); }

  .chapters{ margin-top:14px; border-top:1px solid var(--line); padding-top:12px; }
  .chapter-row{
    display:flex; align-items:center; gap:10px; padding:6px 0; border-bottom:1px dashed var(--line);
  }
  .chapter-row:last-child{ border-bottom:none; }
  .chapter-row input[type="checkbox"]{ width:17px; height:17px; accent-color:var(--moss); flex-shrink:0; }
  .chapter-row .clabel{ flex:1; font-size:14px; min-width:0; overflow-wrap:anywhere; }
  .chapter-row.done .clabel{ color:var(--ink-soft); text-decoration:line-through; text-decoration-color:var(--line); }
  .chapter-row .cx{
    font:inherit; font-size:15px; line-height:1; background:none; border:none; color:var(--ink-soft);
    cursor:pointer; padding:2px 4px; opacity:0; transition:opacity .12s;
  }
  .chapter-row:hover .cx, .chapter-row:focus-within .cx{ opacity:1; }

  .add-chapters{ margin-top:14px; padding-top:12px; border-top:1px solid var(--line); }
  .mode-switch{ display:flex; gap:6px; margin-bottom:10px; }
  .mode-btn{
    font:inherit; font-size:12.5px; font-weight:600; color:var(--ink-soft); background:var(--surface-2);
    border:1px solid var(--line); border-radius:8px; padding:5px 10px; cursor:pointer;
  }
  .mode-btn[aria-pressed="true"]{ background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }

  textarea, input[type="text"], input[type="number"]{
    font:inherit; font-size:14px; width:100%; border:1px solid var(--line); border-radius:8px;
    background:var(--surface-2); color:var(--ink); padding:8px 10px;
  }
  textarea{ min-height:78px; resize:vertical; font-family:inherit; }
  label.field-label{ font-size:11.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-soft); display:block; margin-bottom:4px; }
  .field{ margin-bottom:10px; }
  .inline-fields{ display:flex; gap:8px; align-items:flex-end; }
  .inline-fields .field{ flex:1; margin-bottom:0; }

  .btn{
    font:inherit; font-size:13.5px; font-weight:600; border-radius:8px; padding:8px 14px;
    border:1px solid var(--accent); background:var(--accent); color:var(--accent-ink); cursor:pointer;
  }
  .btn.ghost{ background:transparent; color:var(--accent); }

  .add-book-card{
    border:1.5px dashed var(--line); border-radius:14px; background:transparent;
    display:flex; align-items:center; justify-content:center; min-height:120px;
    cursor:pointer; color:var(--ink-soft); font-weight:600; font-size:14.5px;
    transition:border-color .15s, color .15s;
  }
  .add-book-card:hover{ border-color:var(--accent); color:var(--accent); }
  .add-book-form{
    background:var(--surface); border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow);
    padding:18px; grid-column:1/-1; max-width:420px;
  }
  .add-book-form h3{ margin:0 0 12px; font-size:17px; }
  .form-actions{ display:flex; gap:8px; margin-top:6px; }

  .empty-note{ font-size:13.5px; color:var(--ink-soft); padding:6px 0 2px; }

  .toast{
    position:fixed; left:50%; bottom:22px; transform:translateX(-50%);
    background:var(--ink); color:var(--bg); font-size:13.5px; font-weight:500; padding:9px 16px;
    border-radius:99px; box-shadow:var(--shadow); opacity:0; pointer-events:none; transition:opacity .25s, transform .25s;
    z-index:50; white-space:nowrap;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(-4px); }

  .device-note{
    font-size:12.5px; color:var(--ink-soft); background:var(--surface-2); border:1px solid var(--line);
    border-radius:10px; padding:8px 12px; margin-bottom:18px;
  }

  @media (max-width:480px){
    header.top{ flex-direction:column; align-items:stretch; }
    .summary-card{ min-width:0; }
  }
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
</head>

  var STATE = loadState();

  function loadState(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        var parsed = JSON.parse(raw);
        if (parsed && Array.isArray(parsed.books)) return parsed;
      }
    }catch(e){}
    return { books: JSON.parse(JSON.stringify(DEFAULT_BOOKS)), filter: "all" };
  }

  function saveState(){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(STATE));
    }catch(e){
      showToast("Couldn't save — storage unavailable");
    }
  }

  var pendingConfirm = {};
  var SPINES = ["#2F4858","#A9772F","#5B7553","#7A4B5C","#3F5D6B","#8A6A2F"];

  function spineColor(id){
    var h = 0;
    for (var i=0;i<id.length;i++){ h = (h*31 + id.charCodeAt(i)) >>> 0; }
    return SPINES[h % SPINES.length];
  }

  function uid(prefix){
    return prefix + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
  }

  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }

  function bookStats(book){
    var total = book.chapters.length;
    var done = book.chapters.filter(function(c){ return c.done; }).length;
    var pct = total ? Math.round((done/total)*100) : 0;
    var status = total === 0 ? "empty" : (done === 0 ? "notstarted" : (done === total ? "finished" : "reading"));
    return {total:total, done:done, pct:pct, status:status};
  }

  function overallStats(){
    var totalBooks = STATE.books.length;
    var totalCh = 0, doneCh = 0;
    STATE.books.forEach(function(b){
      var s = bookStats(b);
      totalCh += s.total; doneCh += s.done;
    });
    var pct = totalCh ? Math.round((doneCh/totalCh)*100) : 0;
    return {totalBooks:totalBooks, totalCh:totalCh, doneCh:doneCh, pct:pct};
  }

  function statusLabel(s){
    return {finished:"Finished", reading:"Reading", notstarted:"Not started", empty:"No chapters yet"}[s];
  }

  function render(){
    var app = document.getElementById("app");
    var o = overallStats();

    var visibleBooks = STATE.books.filter(function(b){
      if (STATE.filter === "all") return true;
      var s = bookStats(b).status;
      if (STATE.filter === "reading") return s === "reading" || s === "notstarted" || s === "empty";
      if (STATE.filter === "finished") return s === "finished";
      return true;
    });

    var html = '<a class="back-link" href="index.html">&larr; Book Maps</a>';

    html += '<header class="top">';
    html += '  <div><h1 class="display">Reading Ledger</h1><p class="tag">Mark off chapters as you go, watch the shelf fill in.</p></div>';
    html += '  <div class="summary-card">';
    html += '    <div class="row"><span class="label">Books</span><span class="value num">' + o.totalBooks + '</span></div>';
    html += '    <div class="row"><span class="label">Chapters read</span><span class="value num">' + o.doneCh + ' / ' + o.totalCh + '</span></div>';
    html += '    <div class="bar"><span style="width:' + o.pct + '%"></span></div>';
    html += '  </div>';
    html += '</header>';

    html += '<div class="device-note">Progress here is saved in this browser only — it won\'t show up if you open this page on another device.</div>';

    html += '<div class="tabs" role="tablist">';
    [["all","All"],["reading","Reading"],["finished","Finished"]].forEach(function(t){
      html += '<button class="tab" data-action="filter" data-filter="' + t[0] + '" aria-pressed="' + (STATE.filter===t[0]) + '">' + t[1] + '</button>';
    });
    html += '</div>';

    html += '<div class="shelf">';
    visibleBooks.forEach(function(book){ html += renderBook(book); });

    if (STATE.showAddBook) {
      html += renderAddBookForm();
    } else {
      html += '<button class="add-book-card" data-action="show-add-book">+ Add a book</button>';
    }
    html += '</div>';

    if (visibleBooks.length === 0 && !STATE.showAddBook) {
      html += '<p class="empty-note">Nothing here yet' + (STATE.filter !== "all" ? " in this view." : ".") + '</p>';
    }

    html += '<div class="toast" id="toast"></div>';

    app.innerHTML = html;
  }

  function renderBook(book){
    var s = bookStats(book);
    var expanded = !!book.expanded;
    var out = '<div class="book" data-book="' + book.id + '" data-expanded="' + expanded + '">';
    out += '<div class="spine" style="background:' + spineColor(book.id) + '"></div>';
    out += '<div class="body">';
    out += '<h3 class="display">' + esc(book.title) + '</h3>';
    if (book.author) out += '<p class="author">' + esc(book.author) + '</p>';
    out += '<span class="status-pill ' + s.status + '">' + statusLabel(s.status) + '</span>';
    if (s.total > 0) {
      out += '<div class="progress-row"><div class="bar"><span style="width:' + s.pct + '%"></span></div><span class="pct num">' + s.pct + '%</span></div>';
      out += '<p class="count num">' + s.done + ' of ' + s.total + ' chapters</p>';
    }
    out += '<div class="book-actions">';
    out += '<button class="link-btn" data-action="toggle-expand" data-book="' + book.id + '"><span class="chevron">&#9656;</span> ' + (s.total ? "Chapters" : "Add chapters") + '</button>';
    out += '<button class="link-btn danger" data-action="delete-book" data-book="' + book.id + '">' + (pendingConfirm['book:'+book.id] ? "Confirm?" : "Remove") + '</button>';
    out += '</div>';

    if (expanded) {
      out += '<div class="chapters">';
      book.chapters.forEach(function(ch){
        out += '<div class="chapter-row ' + (ch.done?'done':'') + '">';
        out += '<input type="checkbox" data-action="toggle-chapter" data-book="' + book.id + '" data-chapter="' + ch.id + '" ' + (ch.done?'checked':'') + ' id="chk-' + ch.id + '">';
        out += '<label class="clabel" for="chk-' + ch.id + '">' + esc(ch.label) + '</label>';
        out += '<button class="cx" title="Remove chapter" data-action="delete-chapter" data-book="' + book.id + '" data-chapter="' + ch.id + '">&times;</button>';
        out += '</div>';
      });
      out += '</div>';

      out += '<div class="add-chapters">';
      var mode = book._addMode || "count";
      out += '<div class="mode-switch">';
      out += '<button class="mode-btn" data-action="set-mode" data-book="' + book.id + '" data-mode="count" aria-pressed="' + (mode==="count") + '">By count</button>';
      out += '<button class="mode-btn" data-action="set-mode" data-book="' + book.id + '" data-mode="paste" aria-pressed="' + (mode==="paste") + '">Paste titles</button>';
      out += '<button class="mode-btn" data-action="set-mode" data-book="' + book.id + '" data-mode="single" aria-pressed="' + (mode==="single") + '">One at a time</button>';
      out += '</div>';

      if (mode === "count") {
        out += '<div class="inline-fields">';
        out += '<div class="field"><label class="field-label">How many more chapters</label><input type="number" min="1" max="200" placeholder="e.g. 18" id="count-input-' + book.id + '"></div>';
        out += '<button class="btn" data-action="add-by-count" data-book="' + book.id + '">Add</button>';
        out += '</div>';
      } else if (mode === "paste") {
        out += '<div class="field"><label class="field-label">One chapter per line</label><textarea id="paste-input-' + book.id + '" placeholder="Chapter 1: Departure\nChapter 2: The Crossing\n&hellip;"></textarea></div>';
        out += '<button class="btn" data-action="add-by-paste" data-book="' + book.id + '">Add chapters</button>';
      } else {
        out += '<div class="inline-fields">';
        out += '<div class="field"><label class="field-label">Chapter title</label><input type="text" id="single-input-' + book.id + '" placeholder="e.g. The Long Road" maxlength="200"></div>';
        out += '<button class="btn" data-action="add-single" data-book="' + book.id + '">Add</button>';
        out += '</div>';
      }
      out += '</div>';
    }

    out += '</div></div>';
    return out;
  }

  function renderAddBookForm(){
    var out = '<div class="add-book-form">';
    out += '<h3 class="display">Add a book</h3>';
    out += '<div class="field"><label class="field-label">Title</label><input type="text" id="new-book-title" maxlength="200" placeholder="Book title"></div>';
    out += '<div class="field"><label class="field-label">Author (optional)</label><input type="text" id="new-book-author" maxlength="150" placeholder="Author"></div>';
    out += '<div class="form-actions">';
    out += '<button class="btn" data-action="create-book">Add to shelf</button>';
    out += '<button class="btn ghost" data-action="hide-add-book">Cancel</button>';
    out += '</div></div>';
    return out;
  }

  function showToast(msg){
    var t = document.getElementById("toast");
    if (!t) return;
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(showToast._h);
    showToast._h = setTimeout(function(){ t.classList.remove("show"); }, 2600);
  }

  function findBook(id){
    return STATE.books.filter(function(b){ return b.id === id; })[0];
  }

  function onAction(e){
    var el = e.target.closest("[data-action]");
    if (!el) return;
    var action = el.getAttribute("data-action");
    var bookId = el.getAttribute("data-book");
    var book = bookId ? findBook(bookId) : null;

    if (action === "filter") { STATE.filter = el.getAttribute("data-filter"); render(); return; }

    if (action === "show-add-book") {
      STATE.showAddBook = true; render();
      setTimeout(function(){ var f = document.getElementById("new-book-title"); if (f) f.focus(); }, 0);
      return;
    }
    if (action === "hide-add-book") { STATE.showAddBook = false; render(); return; }

    if (action === "create-book") {
      var titleInput = document.getElementById("new-book-title");
      var authorInput = document.getElementById("new-book-author");
      var title = (titleInput.value || "").trim();
      if (!title) { titleInput.focus(); return; }
      var nb = { id: uid("b"), title: title, author: (authorInput.value||"").trim(), chapters: [], expanded: true, _addMode:"count" };
      STATE.books.push(nb);
      STATE.showAddBook = false;
      render(); saveState();
      return;
    }

    if (!book) return;

    if (action === "toggle-expand") { book.expanded = !book.expanded; render(); return; }
    if (action === "set-mode") { book._addMode = el.getAttribute("data-mode"); render(); return; }

    if (action === "toggle-chapter") {
      var chId = el.getAttribute("data-chapter");
      var ch = book.chapters.filter(function(c){ return c.id === chId; })[0];
      if (ch) { ch.done = !ch.done; render(); saveState(); }
      return;
    }

    if (action === "delete-chapter") {
      var dChId = el.getAttribute("data-chapter");
      book.chapters = book.chapters.filter(function(c){ return c.id !== dChId; });
      render(); saveState();
      return;
    }

    if (action === "add-by-count") {
      var countInput = document.getElementById("count-input-" + book.id);
      var n = parseInt(countInput.value, 10);
      if (!n || n < 1) { countInput.focus(); return; }
      n = Math.min(n, 200);
      var start = book.chapters.length + 1;
      for (var i=0;i<n;i++){ book.chapters.push({ id: uid("c"), label: "Chapter " + (start+i), done:false }); }
      countInput.value = "";
      render(); saveState();
      return;
    }

    if (action === "add-by-paste") {
      var pasteInput = document.getElementById("paste-input-" + book.id);
      var lines = (pasteInput.value || "").split("\n").map(function(l){ return l.trim(); }).filter(Boolean);
      lines.forEach(function(line){ book.chapters.push({ id: uid("c"), label: line, done:false }); });
      pasteInput.value = "";
      render(); saveState();
      return;
    }

    if (action === "add-single") {
      var singleInput = document.getElementById("single-input-" + book.id);
      var val = (singleInput.value || "").trim();
      if (!val) { singleInput.focus(); return; }
      book.chapters.push({ id: uid("c"), label: val, done:false });
      singleInput.value = "";
      render(); saveState();
      setTimeout(function(){ var f = document.getElementById("single-input-" + book.id); if (f) f.focus(); }, 0);
      return;
    }

    if (action === "delete-book") {
      var key = "book:" + book.id;
      if (pendingConfirm[key]) {
        clearTimeout(pendingConfirm[key]);
        delete pendingConfirm[key];
        STATE.books = STATE.books.filter(function(b){ return b.id !== book.id; });
        render(); saveState();
      } else {
        pendingConfirm[key] = setTimeout(function(){ delete pendingConfirm[key]; render(); }, 3200);
        render();
      }
      return;
    }
  }

  document.getElementById("app").addEventListener("click", onAction);
  render();
})();
</script>
</body>
</html>
