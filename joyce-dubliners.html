<style>
/* Layout: full-bleed pan/zoom scan of Thom's 1904 map; story filter rail left, note card bottom */
:root{--bg:#f3eedd;--panel:#fbf8ee;--ink:#2a2418;--mute:#6f6650;--line:#d6cdb2;--accent:#8a2b1c;
--display:'IM Fell English',Georgia,serif;--ui:'Public Sans',system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17150f;--panel:#201d15;--ink:#ece4cc;--mute:#a49b82;--line:#3a3526;--accent:#e08a6a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17150f;--panel:#201d15;--ink:#ece4cc;--mute:#a49b82;--line:#3a3526;--accent:#e08a6a;color-scheme:dark}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--ui);overflow:hidden}
#app{height:100%;display:grid;grid-template-columns:250px 1fr;min-height:0}
#rail{background:var(--panel);border-right:1px solid var(--line);padding:14px 12px 14px max(16px,env(safe-area-inset-left,0px));overflow:auto;min-width:0}
h1{font:italic 400 24px/1.1 var(--display);margin:0 0 2px}
.sub{color:var(--mute);font-size:12px;margin:0 0 12px}
.story{display:flex;gap:8px;align-items:center;padding:5px 4px;border-radius:4px;cursor:pointer;width:100%;background:none;border:0;color:inherit;font:inherit;text-align:left}
.story:hover{background:rgba(128,110,60,.12)}
.story[aria-pressed=false]{opacity:.4}
.dot{width:12px;height:12px;border-radius:50%;flex:none}
.story small{margin-left:auto;color:var(--mute);font-variant-numeric:tabular-nums}
.allsw{display:flex;align-items:center;justify-content:space-between;padding:6px 4px 10px;margin-bottom:4px;border-bottom:1px solid var(--line);cursor:pointer;font-weight:600}
.allsw input{position:absolute;opacity:0}
.allsw i{width:40px;height:22px;border-radius:11px;background:var(--line);position:relative;transition:background .15s;flex:none}
.allsw i::after{content:"";position:absolute;left:2px;top:2px;width:18px;height:18px;border-radius:50%;background:var(--panel);box-shadow:0 1px 2px rgba(0,0,0,.4);transition:transform .15s}
.allsw input:checked+i{background:var(--accent)}
.allsw input:checked+i::after{transform:translateX(18px)}
.allsw input:focus-visible+i{outline:2px solid var(--accent);outline-offset:2px}
.opts{margin-top:12px;padding-top:10px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px;font-size:13px}
.note{color:var(--mute);font-size:11.5px;margin-top:12px}
#mapwrap{position:relative;min-width:0;overflow:hidden;touch-action:none;cursor:grab;background:#cfc7ad}
#mapwrap.drag{cursor:grabbing}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
#world img{display:block;width:10265px;height:9348px;max-width:none;user-select:none;-webkit-user-drag:none}
#lines{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
.pin{position:absolute;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.55);color:#fff;font:600 10px/18px var(--ui);text-align:center;padding:0;cursor:pointer}
.pin.approx{border-style:dashed}
.pin.sel{outline:3px solid var(--accent);outline-offset:2px;z-index:5}
.pin[hidden]{display:none}
#card{position:absolute;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));max-width:560px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px 14px;box-shadow:0 4px 16px rgba(0,0,0,.25)}
#card h2{font:italic 400 20px/1.15 var(--display);margin:0}
#card .tag{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin:0 0 4px;display:flex;gap:6px;align-items:center}
#card p{margin:6px 0 0;max-height:30vh;overflow:auto}
#card .x{position:absolute;right:8px;top:6px;background:none;border:0;color:var(--mute);font-size:18px;cursor:pointer}
#zoom{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:4px}
#zoom button{width:34px;height:34px;border-radius:4px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-size:18px;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
@media (max-width:700px){#app{grid-template-columns:1fr;grid-template-rows:auto 1fr}#rail{max-height:34vh;border-right:0;border-bottom:1px solid var(--line);padding-right:max(16px,env(safe-area-inset-right,0px))}.sub,.note{display:none}}
</style>

<script>
const D={"stories": [{"id": "sisters", "title": "The Sisters", "color": "#7a3b8f"}, {"id": "encounter", "title": "An Encounter", "color": "#1f6f8b"}, {"id": "araby", "title": "Araby", "color": "#b3541e"}, {"id": "eveline", "title": "Eveline", "color": "#3c7a3a"}, {"id": "race", "title": "After the Race", "color": "#a02c4a"}, {"id": "gallants", "title": "Two Gallants", "color": "#8a6d00"}, {"id": "boarding", "title": "The Boarding House", "color": "#4a4fa3"}, {"id": "cloud", "title": "A Little Cloud", "color": "#0f7a6b"}, {"id": "counterparts", "title": "Counterparts", "color": "#a8321f"}, {"id": "clay", "title": "Clay", "color": "#6b5b3e"}, {"id": "painful", "title": "A Painful Case", "color": "#222a35"}], "pins": [{"story": "sisters", "name": "Great Britain Street (Father Flynn's house)", "x": 5870, "y": 3700, "key": "Great Britain Street", "text": "The old name of Parnell Street, in north-central Dublin; it was renamed in 1911, after Charles Stewart Parnell. In 1895 it was part of a main east–west thoroughfare lined with small shops, houses and tenements, running through some of the city's poorest districts.", "approx": false}, {"story": "sisters", "name": "S. Catherine's Church, Meath Street", "x": 5120, "y": 4645, "key": "S. Catherine's Church, Meath Street", "text": "Father Flynn's death notice on the door describes him as formerly of S. Catherine's Church, Meath Street, the Catholic church in the Liberties west of Christ Church.", "approx": false}, {"story": "sisters", "name": "Irishtown", "x": 8992, "y": 5140, "key": "Irishtown", "text": "A poor, working-class district at the mouth of the Liffey, next to Ringsend and the docks, where men lived by casual work on the quays and canals. Dubliners thought of its people as clannish and rough. Flynn's rise from there to the Irish College is the more striking.", "approx": false}, {"story": "encounter", "name": "Gardiner Street", "x": 6793, "y": 3353, "key": "Gardiner Street", "text": "A street in north-central Dublin; the Jesuit church of St Francis Xavier stands on Upper Gardiner Street.", "approx": false}, {"story": "encounter", "name": "Canal Bridge", "x": 7668, "y": 2846, "key": "Canal Bridge", "text": "Newcomen Bridge, which carries North Strand Road over the Royal Canal in north-east Dublin.", "approx": true}, {"story": "encounter", "name": "North Strand Road", "x": 7500, "y": 3020, "key": "North Strand Road", "text": "Part of the main road from Dublin to the north-east; it begins just south-west of Newcomen Bridge and runs over the bridge to end at the River Tolka.", "approx": false}, {"story": "encounter", "name": "Wharf Road", "x": 8300, "y": 4040, "key": "Wharf Road", "text": "The popular name for East Wall (now East Wall Road), a sea wall that runs south-east and then south, keeping the River Tolka and Dublin Bay from encroaching on eastern Dublin north of the Liffey. The wall carried a road along its top.", "approx": true}, {"story": "encounter", "name": "Ringsend", "x": 8600, "y": 4720, "key": "Ringsend", "text": "A working-class fishing and dockside district on the south bank of the Liffey at its mouth, reached by the ferry the boys have taken.", "approx": false}, {"story": "encounter", "name": "River Dodder", "x": 8888, "y": 5324, "key": "Dodder", "text": "The River Dodder, which enters the Liffey from the south just short of its mouth and west of Ringsend.", "approx": false}, {"story": "encounter", "name": "Pigeon House", "x": 9700, "y": 4590, "key": "Pigeon House", "text": "Named after the Pidgeon family, it was later a fort (\"an apology for a battery\") and then the Dublin electricity and power station, on a breakwater projecting out into Dublin Bay as a continuation of the south bank of the Liffey. The dove is also a traditional symbol of the Holy Ghost. There were far more direct routes to it from Newcomen Bridge than the one the boys take: their plan is to stay out of sight, so they circle north before turning south-east.", "approx": true}, {"story": "araby", "name": "North Richmond Street", "x": 7200, "y": 2620, "key": "blind", "text": "A \"blind\" street is a dead end. Joyce's family lived at 17 North Richmond Street, off the North Circular Road in north-east Dublin, from 1894 to 1896. In the 1890s the street was lined with modest but not poor houses.", "approx": false}, {"story": "araby", "name": "Christian Brothers' School", "x": 7235, "y": 2665, "key": "Christian Brothers", "text": "The Christian Brothers are a Catholic teaching brotherhood of laymen under temporary vows. Edmund Rice founded their first school in Waterford in 1802. They charged very low fees and favoured practical over academic education. The school stood at the corner of North Richmond Street and the North Circular Road.", "approx": false}, {"story": "araby", "name": "Buckingham Street", "x": 7188, "y": 3044, "key": "Buckingham Street", "text": "A street on the direct route from North Richmond Street towards Amiens Street station (now Connolly), just north of the Liffey in north-east Dublin.", "approx": false}, {"story": "araby", "name": "Westland Row", "x": 7187, "y": 4507, "key": "Westland Row", "text": "Now Pearse Station, south of the Liffey in east Dublin. The Loop Line linked it to Amiens Street station on the north side; trains from Westland Row served the south-east of Ireland, those from Amiens Street the north and west. The crowd waiting here wants the special train to the bazaar.", "approx": false}, {"story": "araby", "name": "Westland Row Station", "x": 7307, "y": 4547, "key": "Westland Row Station", "text": "The boy's train to Ballsbridge calls here; the crowd at the carriage doors is turned back by porters, and he is still waiting after the delays.", "approx": false}, {"story": "araby", "name": "Araby bazaar (Royal Dublin Society, Ballsbridge)", "x": 8808, "y": 6548, "key": "Araby", "text": "\"Araby\" is a poetic old name for Arabia, and Eastern romance was everywhere in nineteenth-century verse and parlour song; It is also the name of a real charity bazaar, \"Araby in Dublin: A Grand Oriental Fête\", held from Monday 14 to Saturday 19 May 1894 in aid of Jervis Street Hospital, which was run by the Catholic Sisters of Mercy; Joyce drew on it. Its theme song, the Wills and Clay ballad, promised songs and tales of Araby that would charm a sigh or a tear, and Moore's \"Araby's Daughter\" sings of a maiden dead of love, asleep among the Pearl Islands. The glamour of the word is what bewitches the boy.", "approx": false}, {"story": "eveline", "name": "North Wall", "x": 8150, "y": 4040, "key": "North Wall", "text": "The quayside dock on the north bank of the Liffey toward its mouth, from which the cross-channel steamers to Liverpool sailed.", "approx": false}, {"story": "race", "name": "Inchicore (the Naas Road)", "x": 1747, "y": 4733, "key": "Inchicore", "text": "A working-class suburb on the western edge of Dublin, best known for the railway works of the Great Southern and Western Railway. Joyce sets the crowd of watchers in a district of labour and poverty, so the \"channel of poverty and inaction\" is something the reader can place on a map.", "approx": true}, {"story": "race", "name": "Westland Row station", "x": 7307, "y": 4547, "key": "Westland Row", "text": "The Dublin terminus of the Dublin and Kingstown Railway, the first railway in Ireland (opened in 1834). From Westland Row the line runs along Dublin Bay to Kingstown. The party take the late train down to the harbour.", "approx": false}, {"story": "race", "name": "Dame Street", "x": 6227, "y": 4400, "key": "Dame Street", "text": "A main thoroughfare running west-east from Dublin Castle to College Green and Trinity College. Joyce brings the party through the old centre of the city, past the banks and the old Parliament House.", "approx": false}, {"story": "race", "name": "Stephen's Green", "x": 6547, "y": 5160, "key": "Stephen's Green", "text": "On the night of the dinner the five young men stroll along Stephen's Green in a faint cloud of aromatic smoke, talking loudly, cloaks dangling from their shoulders.", "approx": false}, {"story": "race", "name": "The Bank (Bank of Ireland)", "x": 6440, "y": 4270, "key": "the Bank", "text": "The Bank of Ireland, in the former Irish Parliament House on College Green at the eastern end of Dame Street. The building was the seat of the Irish parliament until the Act of Union of 1800, so the Irishman parts from his French friends in front of the symbol of lost self-government.", "approx": false}, {"story": "race", "name": "Trinity College", "x": 6720, "y": 4373, "key": "Dublin University", "text": "The formal name of Trinity College, the Protestant and Anglo-Irish university of Dublin. For many years the Catholic hierarchy discouraged or forbade Catholics from attending it. A Catholic butcher's son reading law there, and then sent to Cambridge, is being moved up through the Protestant and English side of the educational ladder.", "approx": false}, {"story": "race", "name": "Grafton Street", "x": 6427, "y": 4713, "key": "Grafton Street", "text": "Dublin's main fashionable shopping street, running south from College Green and Trinity College to Stephen's Green. The car moves towards the smart south side while Jimmy goes the other way, \"northward\", to dress at home.", "approx": false}, {"story": "gallants", "name": "Rutland Square", "x": 6213, "y": 3233, "key": "Rutland Square", "text": "Rutland Square (now Parnell Square), at the northern end of O'Connell Street, with the Rotunda Hospital and its pleasure gardens on the south side. It had been a fashionable address; by 1900 it was slipping. The men walk \"down the hill\" towards O'Connell Street and the south side.", "approx": false}, {"story": "gallants", "name": "Dorset Street", "x": 5987, "y": 3113, "key": "Dorset Street", "text": "A street on Dublin's north side, not far from Rutland Square, lined with small shops and public houses. The afternoon-long drinking and talking that precedes the story is set in Lenehan's home territory.", "approx": false}, {"story": "gallants", "name": "Earl Street", "x": 6560, "y": 3657, "key": "Earl Street", "text": "Corley says he saw the girl driving down Earl Street one night on a car with two fellows, after she had gone on the turf.", "approx": true}, {"story": "gallants", "name": "Waterhouse's clock, Dame Street", "x": 6130, "y": 4405, "key": "Waterhouse's clock", "text": "Waterhouse and Co., the jewellers, on Dame Street, had a clock outside the shop that served as a meeting point for people in the city centre. Corley's choice of the spot is part of his casual pick-up routine.", "approx": false}, {"story": "gallants", "name": "Pim's, South Great George's Street", "x": 6093, "y": 4560, "key": "Pim's", "text": "Pim Brothers, a well-known drapery and general store on South Great George's Street. Corley tells the girl he works in a respectable shop, which would be consistent with the \"bit of class\" he pretends to.", "approx": true}, {"story": "gallants", "name": "Baggot Street", "x": 7067, "y": 5193, "key": "Baggot Street", "text": "A broad street of Georgian houses on the south side of the city, a respectable residential district of doctors, lawyers and the like. A girl in service in one of these houses is on the staff of the professional class, and her \"area\" door is where Corley leaves her at the end.", "approx": false}, {"story": "gallants", "name": "Donnybrook", "x": 7775, "y": 6865, "key": "Donnybrook", "text": "A south-eastern suburb of Dublin reached by tram, in the 1900s on the edge of the city with fields available for courting couples, as Corley's remark about the field suggests. It was also known for its old Donnybrook fair, a byword for brawling.", "approx": true}, {"story": "gallants", "name": "Trinity College", "x": 6720, "y": 4373, "key": "Trinity College", "text": "They are walking south along the west front of Trinity College, the façade set back behind iron railings, at the junction of Grafton Street and Dame Street. The clock Lenehan looks up at is the one on the college buildings.", "approx": false}, {"story": "gallants", "name": "Nassau Street", "x": 6680, "y": 4587, "key": "Nassau Street", "text": "They turn east along the south side of Trinity College, then south into Kildare Street, which runs down to the north side of Stephen's Green.", "approx": false}, {"story": "gallants", "name": "Kildare Street Club (the harpist)", "x": 6773, "y": 4827, "key": "the club", "text": "The Kildare Street Club, at the corner of Nassau and Kildare Streets, a fashionable and exclusive men's club of the Protestant and Anglo-Irish upper class. A harpist who plays for pennies outside it plays to the men who run the country.", "approx": false}, {"story": "gallants", "name": "Stephen's Green", "x": 6547, "y": 5160, "key": "Stephen's Green", "text": "They cross Stephen's Green North, the street at the top of the park, to reach the Green itself. Stephen's Green is the large public park at the south end of Grafton Street.", "approx": false}, {"story": "gallants", "name": "Hume Street", "x": 6833, "y": 5213, "key": "Hume Street", "text": "A short street off Stephen's Green East, across the north-eastern corner of the park. It is where Corley has arranged to meet the girl.", "approx": false}, {"story": "gallants", "name": "Merrion Street", "x": 7020, "y": 5045, "key": "Merrion Street", "text": "The point where Merrion Row, the eastward continuation of Stephen's Green North, meets Baggot Street and Upper Merrion Street, which runs up from the north. It is the meeting-place the men agree, at the south-east corner of the Green.", "approx": false}, {"story": "gallants", "name": "Shelbourne Hotel", "x": 6747, "y": 5053, "key": "Shelbourne Hotel", "text": "The grand hotel at the top of Kildare Street on the north side of Stephen's Green, then as now a fashionable place to stay. Lenehan waits there, on the edge of wealth, and watches.", "approx": false}, {"story": "gallants", "name": "Merrion Square", "x": 7267, "y": 4973, "key": "Merrion Square", "text": "One of Dublin's Georgian squares, in 1900 largely occupied by doctors and surgeons. The couple walk round its western side to catch the Donnybrook tram on the north side.", "approx": false}, {"story": "gallants", "name": "Duke's Lawn", "x": 6900, "y": 4820, "key": "Duke's Lawn", "text": "The lawn in front of Leinster House on the west side of Merrion Square. Leinster House then belonged to the Royal Dublin Society; it now houses the Irish parliament. Lenehan runs his fingers along its railings as he walks.", "approx": true}, {"story": "gallants", "name": "Grafton Street", "x": 6427, "y": 4713, "key": "Grafton Street", "text": "He walks north along Grafton Street, past Trinity College and across O'Connell Bridge up to Rutland Square again, which means he returns to his starting point.", "approx": false}, {"story": "gallants", "name": "Capel Street", "x": 5855, "y": 3900, "key": "Capel Street", "text": "He turns south into Capel Street, crosses the Liffey by Grattan Bridge, and goes by Parliament Street towards City Hall and the Castle.", "approx": false}, {"story": "gallants", "name": "City Hall", "x": 6000, "y": 4440, "key": "City Hall", "text": "The seat of the Dublin Corporation, the city's elected governing body, just south of the river near Dublin Castle.", "approx": false}, {"story": "gallants", "name": "George's Street", "x": 6093, "y": 4587, "key": "George's Street", "text": "South Great George's Street runs south from Dame Street. Lenehan leaves his friends and goes south along it, then east towards Grafton Street.", "approx": false}, {"story": "gallants", "name": "Westmoreland Street", "x": 6530, "y": 4140, "key": "Westmoreland Street", "text": "The street running north from the west front of Trinity College to O'Connell Bridge.", "approx": false}, {"story": "gallants", "name": "City Markets", "x": 6290, "y": 4525, "key": "City Markets", "text": "The City Markets, on the east side of South Great George's Street a block south of Dame Street. Lenehan goes round them along Exchequer and Wicklow Streets to Grafton Street.", "approx": true}, {"story": "gallants", "name": "College of Surgeons", "x": 6320, "y": 5013, "key": "College of Surgeons", "text": "The Royal College of Surgeons in Ireland, at the corner of Stephen's Green West, which oversaw the training and licensing of surgeons. Its clock is one of the markers by which Joyce times Lenehan's wait.", "approx": false}, {"story": "gallants", "name": "Ely Place", "x": 6873, "y": 5273, "key": "Ely Place", "text": "A quiet cul-de-sac off the south side of Baggot Street near Merrion Row, a short and fashionable address. Corley swerves into it and halts under the first lamp.", "approx": false}, {"story": "boarding", "name": "Spring Gardens", "x": 7740, "y": 2492, "key": "Spring Gardens", "text": "A district off North Strand Road, between the Royal Canal and the River Tolka, on the north-eastern outskirts of Dublin.", "approx": true}, {"story": "boarding", "name": "Hardwicke Street", "x": 6212, "y": 2893, "key": "Hardwicke Street", "text": "A street in the north-east of the city, lined in 1900 with modest middle-class houses and tenements. It is close to St. George's Church, whose bells ring in the next scene.", "approx": false}, {"story": "boarding", "name": "Fleet Street (Jack Mooney's office)", "x": 6400, "y": 4205, "key": "Fleet Street (Jack Mooney's office)", "text": "Jack Mooney, the Madam's son, is clerk to a commission agent in Fleet Street.", "approx": true}, {"story": "boarding", "name": "George's Church", "x": 6344, "y": 2761, "key": "George's Church", "text": "St. George's, a Church of Ireland (Protestant) church on Temple Street, just round the corner from Hardwicke Street. The bells ring for a Protestant Sunday service as Mrs. Mooney, who is Catholic, prepares for her interview.", "approx": false}, {"story": "boarding", "name": "Marlborough Street (Pro-Cathedral)", "x": 6567, "y": 3553, "key": "Marlborough Street (Pro-Cathedral)", "text": "Mrs Mooney plans to settle matters with Mr Doran in time to catch short twelve at Marlborough Street, the Catholic Pro-Cathedral.", "approx": false}, {"story": "cloud", "name": "King's Inns", "x": 5640, "y": 3287, "key": "the King's Inns", "text": "The King's Inns is the society of Irish barristers and also its headquarters, a large classical building on the north side of Dublin (completed in the late eighteenth century), with gardens that the public could use. Chandler works there as a clerk, among the lawyers without being one of them.", "approx": false}, {"story": "cloud", "name": "Henrietta Street", "x": 5747, "y": 3367, "key": "Henrietta Street", "text": "One of the earliest Georgian streets of north Dublin, built in the 1720s for the Anglo-Irish aristocracy and judges. By 1900 its \"gaunt spectral mansions\" had become tenements, and the \"horde of grimy children\" are their tenants. Chandler passes by without a thought of the past.", "approx": false}, {"story": "cloud", "name": "Capel Street", "x": 5855, "y": 3900, "key": "Capel Street", "text": "A long street running north from the Liffey at Grattan Bridge. It is a street of shops, which Chandler finds \"dull\" and \"inelegant\" once the idea of London has seized him.", "approx": false}, {"story": "cloud", "name": "Grattan Bridge", "x": 5895, "y": 4185, "key": "Grattan Bridge", "text": "Grattan Bridge crosses the Liffey between Capel Street on the north and Parliament Street on the south. From the middle Chandler sees the lower quays, the run-down riverside houses, and the sunset.", "approx": false}, {"story": "cloud", "name": "Bewley's, Westmoreland Street", "x": 6490, "y": 4235, "key": "Bewley's", "text": "Bewley's was a Dublin firm of tea and coffee merchants with shops in the city centre. Chandler's forgetting of an errand is one of the small failures which have put his wife in a bad humour.", "approx": true}, {"story": "cloud", "name": "Corless's, Burgh Quay", "x": 6680, "y": 4040, "key": "Corless's", "text": "Corless's was a well-known restaurant and bar in Parliament Street, a smart place for oysters after the theatre. Chandler has never entered it, which is one measure of his timid life.", "approx": true}, {"story": "counterparts", "name": "Eustace Street", "x": 6115, "y": 4310, "key": "Eustace Street", "text": "A street running south from Dame Street near Temple Bar, in the old part of central Dublin where several firms of solicitors had offices.", "approx": false}, {"story": "counterparts", "name": "Terry Kelly's pawn-office, Fleet Street", "x": 6380, "y": 4205, "key": "Terry Kelly's", "text": "A pawnbroker's in Fleet Street, in the Temple Bar district just south of the Liffey. To pawn a watch was to hand it over as security for a loan, and to \"stand\" the loan in coins is what Farrington does.", "approx": true}, {"story": "counterparts", "name": "Fownes's Street (Callan's)", "x": 6290, "y": 4320, "key": "Fownes's Street (Callan's)", "text": "Farrington tells the story of his retort to the chief clerk as it was told in Callan's of Fownes's Street, in the Temple Bar quarter.", "approx": true}, {"story": "counterparts", "name": "Temple Bar", "x": 6220, "y": 4220, "key": "Temple Bar", "text": "The quarter of old narrow streets south of the Liffey between Dame Street and the river, named for Sir William Temple. It was then a district of small shops and warehouses, and since the 1990s a tourist area.", "approx": false}, {"story": "counterparts", "name": "Davy Byrne's, Duke Street", "x": 6547, "y": 4680, "key": "Davy Byrne's", "text": "A real pub in Duke Street, which appears in the Lestrygonians episode of Ulysses, where Bloom has his lunch. Farrington's friends are there.", "approx": false}, {"story": "counterparts", "name": "Ballast Office", "x": 6535, "y": 4120, "key": "the Ballast Office", "text": "The headquarters of the Dublin Port and Docks Board, at the corner of Westmoreland Street and Aston Quay. A time-ball and clock on the building were a meeting-place.", "approx": false}, {"story": "counterparts", "name": "The Scotch House", "x": 6670, "y": 4055, "key": "the Scotch House", "text": "A well-known public house on Burgh Quay on the south side of the Liffey, close to the Tivoli.", "approx": false}, {"story": "counterparts", "name": "The Tivoli", "x": 6700, "y": 4030, "key": "the Tivoli", "text": "The Tivoli Theatre of Varieties, a music hall on Burgh Quay. Weathers is an acrobat and \"knockabout artiste\", a performer who does rough slapstick turns.", "approx": true}, {"story": "counterparts", "name": "Mulligan's, Poolbeg Street", "x": 6745, "y": 4085, "key": "Mulligan's", "text": "A pub in Poolbeg Street, near the river and the Tivoli, which still exists.", "approx": false}, {"story": "counterparts", "name": "O'Connell Bridge (the Sandymount tram)", "x": 6520, "y": 4047, "key": "the Sandymount tram", "text": "O'Connell Bridge spans the Liffey in the centre of Dublin, and the Sandymount tram ran south-east to Farrington's suburb.", "approx": false}, {"story": "counterparts", "name": "Shelbourne Road, Ringsend", "x": 8456, "y": 5548, "key": "Shelbourne Road", "text": "In the Ballsbridge/Ringsend area on the south-east side of Dublin, near the Beggars Bush military barracks. The man has a long way from the city to his home.", "approx": false}, {"story": "clay", "name": "Dublin by Lamplight laundry, Ballsbridge", "x": 8450, "y": 6330, "key": "Dublin by Lamplight", "text": "A real institution, a Protestant-run Magdalene laundry at Ballsbridge in south Dublin, founded in 1856 and managed by a committee of Church of Ireland ladies, where \"fallen\" women worked at washing. Maria, a Catholic, is the peacemaker among the women there. The story never says what the \"women\" are, and the details of the place (the quarrels over the tubs, the tracts on the walls) are left to suggest it.", "approx": true}, {"story": "clay", "name": "Nelson's Pillar", "x": 6487, "y": 3715, "key": "the Pillar", "text": "Nelson's Pillar in Sackville Street (now O'Connell Street) in the middle of Dublin, from which the tram lines ran out to the suburbs. It was blown up in 1966. The journey is by tram: Ballsbridge to the Pillar, then another tram north to Drumcondra.", "approx": false}, {"story": "clay", "name": "Downes's cake-shop", "x": 6455, "y": 3725, "key": "Downes's", "text": "Sir Joseph Downes's confectionery, at 6 Earl Street North, a short way east of Nelson's Pillar. The shop is so crowded that she waits a long time to be served.", "approx": false}, {"story": "clay", "name": "Henry Street", "x": 6333, "y": 3733, "key": "Henry Street", "text": "Henry Street runs west from the Pillar, and had several pastry-cooks and confectioners. Maria goes there to find the plumcake with more icing.", "approx": false}, {"story": "clay", "name": "Drumcondra", "x": 6580, "y": 2130, "key": "Drumcondra", "text": "A northern suburb of Dublin, beyond the Royal Canal. The Donnellys live there, and the tram journey takes Maria across the whole city.", "approx": false}, {"story": "clay", "name": "Canal Bridge (Binn's Bridge)", "x": 6557, "y": 2219, "key": "the Canal Bridge", "text": "Binn's Bridge, which carries Dorset Street over the Royal Canal into Drumcondra Road Lower, on the northern edge of the city.", "approx": false}, {"story": "painful", "name": "Chapelizod", "x": 430, "y": 3920, "key": "Chapelizod", "text": "A village on the Liffey about three miles west of the centre of Dublin, at the south-west corner of Phoenix Park. Its name means \"Iseult's chapel\", and in some Irish versions of the legend of Tristan and Iseult it is the place where the lovers consummated their love; Phoenix Park is associated with the forest where Tristan retreated in despair. Duffy lives in a place whose name belongs to the most famous of tragic love stories.", "approx": true}, {"story": "painful", "name": "Baggot Street (the private bank)", "x": 7120, "y": 5230, "key": "a private bank", "text": "There were several small private and branch banks in Baggot Street, the south-eastern extension of Stephen's Green North. A cashier was a senior officer, responsible for the bank's money and for the staff who handled it.", "approx": true}, {"story": "painful", "name": "The Lucan road", "x": 900, "y": 3990, "key": "the Lucan road", "text": "The road along the south bank of the Liffey from Chapelizod to the village of Lucan, four miles to the west.", "approx": true}, {"story": "painful", "name": "George's Street", "x": 6093, "y": 4587, "key": "George's Street", "text": "There are two George's Streets in Dublin. The north one was lined with well-to-do houses and had no eating-houses; South Great George's Street was a commercial street with several modest ones, and lay on his route from Baggot Street to Chapelizod.", "approx": false}, {"story": "painful", "name": "The Rotunda", "x": 6267, "y": 3300, "key": "the Rotunda", "text": "A group of buildings in the south-east corner of Rutland (now Parnell) Square, with a theatre, a concert hall and assembly rooms. The money from their hire helped to support the Rotunda maternity hospital next door.", "approx": false}, {"story": "painful", "name": "Earlsfort Terrace", "x": 6633, "y": 5460, "key": "Earlsfort Terrace", "text": "The south extension of Stephen's Green East, where the Dublin International Exhibition building stood. In the early twentieth century it was used for concerts and meetings, and later became part of University College, Dublin.", "approx": false}, {"story": "painful", "name": "Mrs Sinico's cottage, Irishtown", "x": 9000, "y": 5190, "key": "her little cottage", "text": "Mrs. Sinico lives in Sydney Parade Avenue, in the modestly prosperous village of Merrion on Dublin Bay, about three miles south-east of the General Post Office.", "approx": false}, {"story": "painful", "name": "Parkgate", "x": 4160, "y": 3904, "key": "Parkgate", "text": "The south-eastern and main entrance to Phoenix Park, whose 1,760 acres lie north of the Liffey in western Dublin. The name \"Phoenix\" is an English corruption of the Irish Fionn-uisce, \"clear water\". The phoenix is the mythical bird that is consumed by fire and born again, a traditional symbol of Christ, of regenerative love, and for the Irish of the rebirth of the nation.", "approx": false}, {"story": "painful", "name": "Phoenix Park (roads of the Park)", "x": 3568, "y": 3560, "key": "Phoenix Park (roads of the Park)", "text": "The Park is where Duffy and Mrs Sinico walk up and down for nearly three hours after meeting in a cake-shop near the Parkgate, and agree to break off their intercourse.", "approx": true}, {"story": "painful", "name": "Sydney Parade station", "x": 9620, "y": 7010, "key": "Sydney Parade", "text": "The railway station in the village of Merrion, in Sydney Parade Avenue; Mrs. Sinico's house is nearby.", "approx": true}, {"story": "painful", "name": "City of Dublin Hospital", "x": 7624, "y": 5700, "key": "the City of Dublin Hospital", "text": "The Royal City of Dublin Hospital in Upper Baggot Street, a charitable institution which received accident cases at all hours without recommendation. It lay just south of the Grand Canal, a mile and a half north-west of Sydney Parade.", "approx": false}, {"story": "painful", "name": "Magazine Hill", "x": 2772, "y": 3547, "key": "Magazine Hill", "text": "Thomas's Hill on the south side of the park above the Liffey, topped by an eighteenth-century Magazine Fort. He has walked over a mile into the park.", "approx": true}, {"story": "painful", "name": "Kingsbridge Station", "x": 4000, "y": 4088, "key": "Kingsbridge Station", "text": "Now Heuston Station, just south of the Liffey opposite the eastern end of the park. It was the terminus of the Great Southern and Western Railway, serving the south and south-west of Ireland (Cork).", "approx": false}]};
const W=10265,H=9348;
const wrap=document.getElementById('mapwrap'),world=document.getElementById('world'),pinsEl=document.getElementById('pins'),lines=document.getElementById('lines');
let s=0.15,tx=0,ty=0;const minS=0.06,maxS=0.9;
const st={};D.stories.forEach(x=>st[x.id]=x);
const on={};D.stories.forEach(x=>on[x.id]=true);
function apply(){world.style.transform=`translate(${tx}px,${ty}px) scale(${s})`;pinsEl.style.cssText='';place()}
function place(){/* pins are in world space but counter-scaled */pinEls.forEach(e=>{e.el.style.transform=`translate(${e.dx/s}px,${e.dy/s}px) scale(${1/s})`})}
function fit(){const r=wrap.getBoundingClientRect();s=Math.min(r.width/W,r.height/H)*1.0;s=Math.max(s,minS);tx=(r.width-W*s)/2;ty=(r.height-H*s)/2;apply()}
function zoomAt(cx,cy,f){const ns=Math.min(maxS,Math.max(minS,s*f));tx=cx-(cx-tx)*ns/s;ty=cy-(cy-ty)*ns/s;s=ns;apply()}
function focusOn(x,y,z){const r=wrap.getBoundingClientRect();s=Math.max(s,z);tx=r.width/2-x*s;ty=r.height*0.4-y*s;apply()}
const pinEls=[];const counts={};
D.pins.forEach(p=>{counts[p.story]=(counts[p.story]||0)+1;p.n=counts[p.story]});
const groups={};D.pins.forEach(p=>{const k=Math.round(p.x/60)+','+Math.round(p.y/60);(groups[k]=groups[k]||[]).push(p)});
D.pins.forEach(p=>{
 const g=groups[Math.round(p.x/60)+','+Math.round(p.y/60)];const i=g.indexOf(p);const a=i*2.4;
 const off=g.length>1?{dx:Math.cos(a)*13*(1+Math.floor(i/6)*.0),dy:Math.sin(a)*13}:{dx:0,dy:0};
 const b=document.createElement('button');b.className='pin'+(p.approx?' approx':'');b.style.left=p.x+'px';b.style.top=p.y+'px';b.style.background=st[p.story].color;b.textContent=p.n;b.style.transformOrigin='0 0';
 b.setAttribute('aria-label',p.name+' — '+st[p.story].title);
 b.addEventListener('click',e=>{e.stopPropagation();select(p,b)});
 b.addEventListener('pointerdown',e=>e.stopPropagation());
 pinsEl.appendChild(b);p.el=b;pinEls.push({el:b,dx:off.dx-0,dy:off.dy-0,p});
});
// origin fix: centre pin on its point regardless of scale
pinEls.forEach(e=>{e.el.style.margin='0';e.el.style.marginLeft='-11px';e.el.style.marginTop='-11px';e.el.style.transformOrigin='11px 11px'});
let sel=null;
function select(p,b){document.querySelectorAll('.pin.sel').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');sel=p;
 const c=document.getElementById('card');c.hidden=false;document.getElementById('cdot').style.background=st[p.story].color;
 document.getElementById('cstory').textContent=st[p.story].title+' · stop '+p.n;document.getElementById('ctitle').textContent=p.name;
 document.getElementById('ctext').textContent=p.text+(p.approx?' (Position on the map is approximate.)':'');}
document.querySelector('#card .x').onclick=()=>{document.getElementById('card').hidden=true;document.querySelectorAll('.pin.sel').forEach(x=>x.classList.remove('sel'))};
// story list
const btns=[];const allEl=document.getElementById('all');
function syncAll(){allEl.checked=Object.values(on).some(v=>v)}
allEl.onchange=()=>{btns.forEach(([x,b])=>{on[x.id]=allEl.checked;b.setAttribute('aria-pressed',allEl.checked)});refresh()};
const sl=document.getElementById('stories');
D.stories.forEach(x=>{const b=document.createElement('button');b.className='story';b.setAttribute('aria-pressed','true');
 b.innerHTML=`<span class="dot" style="background:${x.color}"></span><span>${x.title}</span><small>${counts[x.id]||0}</small>`;
 b.onclick=()=>{on[x.id]=!on[x.id];b.setAttribute('aria-pressed',on[x.id]);refresh();syncAll()};sl.appendChild(b);btns.push([x,b])});
function refresh(){D.pins.forEach(p=>p.el.hidden=!on[p.story]);drawLines()}
function drawLines(){lines.innerHTML='';if(!document.getElementById('route').checked)return;
 D.stories.forEach(x=>{if(!on[x.id])return;const pts=D.pins.filter(p=>p.story===x.id).map(p=>p.x+','+p.y);if(pts.length<2)return;
 const pl=document.createElementNS('http://www.w3.org/2000/svg','polyline');pl.setAttribute('points',pts.join(' '));pl.setAttribute('fill','none');pl.setAttribute('stroke',x.color);pl.setAttribute('stroke-width','12');pl.setAttribute('stroke-dasharray','40 28');pl.setAttribute('opacity','.75');lines.appendChild(pl)})}
document.getElementById('route').onchange=drawLines;
// interaction
const ptrs=new Map();let last=null,pd=0,moved=false;
wrap.addEventListener('pointerdown',e=>{wrap.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,[e.clientX,e.clientY]);wrap.classList.add('drag');moved=false;if(ptrs.size==2){const[a,b]=[...ptrs.values()];pd=Math.hypot(a[0]-b[0],a[1]-b[1])}});
wrap.addEventListener('pointermove',e=>{if(!ptrs.has(e.pointerId))return;const o=ptrs.get(e.pointerId);
 if(ptrs.size==1){tx+=e.clientX-o[0];ty+=e.clientY-o[1];apply();}
 ptrs.set(e.pointerId,[e.clientX,e.clientY]);
 if(ptrs.size==2){const[a,b]=[...ptrs.values()];const d=Math.hypot(a[0]-b[0],a[1]-b[1]);const r=wrap.getBoundingClientRect();zoomAt((a[0]+b[0])/2-r.left,(a[1]+b[1])/2-r.top,d/pd);pd=d}});
const up=e=>{ptrs.delete(e.pointerId);if(!ptrs.size)wrap.classList.remove('drag')};
wrap.addEventListener('pointerup',up);wrap.addEventListener('pointercancel',up);
wrap.addEventListener('wheel',e=>{e.preventDefault();const r=wrap.getBoundingClientRect();zoomAt(e.clientX-r.left,e.clientY-r.top,Math.exp(-e.deltaY*0.0015))},{passive:false});
const ctr=()=>{const r=wrap.getBoundingClientRect();return[r.width/2,r.height/2]};
document.getElementById('zi').onclick=()=>zoomAt(...ctr(),1.5);document.getElementById('zo').onclick=()=>zoomAt(...ctr(),1/1.5);
addEventListener('resize',()=>apply());
fit();refresh();
const first=D.pins.find(p=>p.name.startsWith('Nelson'));if(first){focusOn(first.x,first.y,0.3)}
</script>
